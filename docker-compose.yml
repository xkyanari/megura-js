# Runs the bot in Docker in place of pm2. MySQL and Redis stay on the host.
#
#   docker compose up -d --build          start (and rebuild after pulling new code)
#   docker compose logs -f                follow the bot's output
#   docker compose run --rm bot node deploy.js    register slash commands
#   docker compose down                   stop
#
# See the "Running with Docker" section of README.md.

services:
  bot:
    build: .
    image: megura-bot
    container_name: megura-bot
    # start on boot and after crashes, like pm2
    restart: unless-stopped
    # forward SIGTERM to node so `docker compose down` stops the bot cleanly
    init: true
    # share the host's network so 127.0.0.1 in config.json still reaches the
    # MySQL and Redis already running on this server. The bot opens no ports,
    # except the vote webhook server when VOTE_PORT is set in .env.
    network_mode: host
    env_file:
      - path: .env
        required: false
    # Sized for a 2 GB server shared with MySQL and Redis: if memory runs away,
    # Node exits (and restarts) before the kernel starts killing other processes.
    environment:
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 768m
    volumes:
      # create_host_path: false makes a missing file an error instead of
      # Docker silently creating an empty directory in its place
      - type: bind
        source: ./config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./assets/features.json
        target: /app/assets/features.json
        read_only: true
        bind:
          create_host_path: false
      - megura-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

volumes:
  megura-logs:
