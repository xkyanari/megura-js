name: Deploy

# Updates the bot on the server once the tests pass on main (or when run by
# hand), by running scripts/update.sh over SSH. Needs these repository
# secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST          the server's address
#   DEPLOY_USER          the user that owns the checkout and can run docker
#   DEPLOY_SSH_KEY       that user's deploy private key
#   DEPLOY_KNOWN_HOSTS   the output of `ssh-keyscan <host>`, so the server is verified
#   DEPLOY_PATH          optional: the checkout's path (default ~/megura-js)
#   DEPLOY_PORT          optional: the SSH port (default 22)
# Without them the job is skipped. See "Automatic updates" in README.md.

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Update the server
    # only after a green test run of a push to main (not a PR from a fork)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
    steps:
      - name: Check the deploy settings
        id: settings
        env:
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_KNOWN_HOSTS != '' }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::notice::Deploy secrets aren't set, so nothing was deployed. See 'Automatic updates' in README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.settings.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Run scripts/update.sh on the server
        if: steps.settings.outputs.ready == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
            -o StrictHostKeyChecking=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '${DEPLOY_PATH:-megura-js}' && bash scripts/update.sh"
